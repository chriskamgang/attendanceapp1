plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// La clé Google Maps n'est pas versionnée : elle est lue dans
// android/local.properties, aux côtés des chemins du SDK.
def mapsApiKey = localProperties.getProperty('MAPS_API_KEY') ?: ''

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.estuaire.attendance_app"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "cm.iues.insam.attendance"
        minSdk 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true

        // INSAM BUS : clé Google Maps de la carte de suivi. Elle vit dans
        // local.properties, hors dépôt. Absente, la carte s'affiche grise —
        // le reste de l'application n'en dépend pas.
        manifestPlaceholders += [MAPS_API_KEY: mapsApiKey]
    }

    // La signature de release n'est configurée que si key.properties est
    // présent : ce fichier ne suit pas le dépôt, et un `storeFile` nul y
    // faisait échouer jusqu'au build de debug sur les postes qui ne
    // publient pas.
    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

configurations {
    all {
        exclude group: 'com.github.scottyab', module: 'rootbeer'
    }
}

dependencies {
    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'

    // AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Core library desugaring
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Force the newer version of rootbeer to avoid duplicate classes
    implementation 'com.scottyab:rootbeer-lib:0.1.1'
}

// Apply Google Services plugin at the end
apply plugin: 'com.google.gms.google-services'
