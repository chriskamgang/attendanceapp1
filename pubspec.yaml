name: attendance_app
description: "Estuaire RH — pointage par géolocalisation et transport de campus INSAM BUS"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
version: 3.0.0+8

environment:
  sdk: '>=3.5.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # HTTP & API
  http: ^1.2.2
  dio: ^5.4.0

  # State Management
  # Provider porte l'espace Estuaire RH, GetX l'espace INSAM BUS : les deux
  # cohabitent, chacun cantonné à son univers (voir lib/bus/).
  provider: ^6.1.1
  get: ^4.7.3

  # Storage
  shared_preferences: ^2.3.3

  # Geolocation
  geolocator: ^13.0.2
  geofence_service: ^6.0.0+1

  # Device Info
  device_info_plus: ^10.0.1

  # Security (Anti-Fraud Detection)
  flutter_jailbreak_detection: ^1.10.0
  safe_device: ^1.1.5
  network_info_plus: ^6.0.0

  # Deep Links & Navigation
  app_links: ^6.3.3

  # Google Maps (pointage + suivi du bus en direct)
  google_maps_flutter: ^2.9.0

  # Firebase (pour notifications)
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

  # Utils
  intl: ^0.20.2
  flutter_local_notifications: ^22.3.0
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9

  # UI Components
  flutter_spinkit: ^5.2.0
  fluttertoast: ^8.2.4
  open_filex: ^4.7.0
  path_provider: ^2.1.5

  # --- INSAM BUS ---------------------------------------------------------
  # Pass étudiant affiché en QR, scanné par le chauffeur à la montée.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.4
  # Suivi du bus en temps réel : Reverb parle le protocole Pusher.
  web_socket_channel: ^3.0.1
  # Cap magnétique : le GPS ne donne un cap fiable qu'en mouvement, la
  # boussole prend le relais à l'arrêt pour orienter le bus sur la carte.
  flutter_compass: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/img/
    - assets/icon/

  fonts:
    - family: SFPro
      fonts:
        - asset: assets/fonts/SF-Pro/SF-Pro.ttf

# Configuration pour les icônes de l'application
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
